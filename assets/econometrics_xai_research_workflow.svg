<text x="49" y="153" font-family="Arial" font-weight="700" font-size="13" fill="#20364e">THEORY + DESIGN</text>
<text x="49" y="177" font-family="Arial" font-size="13" fill="#4d6073">Research questions</text>
<text x="49" y="195" font-family="Arial" font-size="12" fill="#4d6073">Constructs & units</text>
