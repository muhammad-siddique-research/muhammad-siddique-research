<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 284" width="1040" height="284" role="img" aria-labelledby="t d">
<title id="t">Interdisciplinary research workflow from theory to statistical inference and explainable AI</title>
<desc id="d">Five connected phases: theory and research design; temporal data engineering; econometric modeling and robust inference; predictive machine learning with grouped validation; and explainability, calibration and transfer. The diagram distinguishes prediction and explanation from causal identification.</desc>
<rect x="0" y="0" width="1040" height="284" rx="18" fill="#f8fafc"/>
<rect x="11" y="10" width="1018" height="264" rx="13" fill="#ffffff" stroke="#dfe7ed"/>
<text x="37" y="46" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#182f48">Research workflow | From theory to transparent evidence</text>
<text x="37" y="70" font-family="Arial,sans-serif" font-size="14" fill="#5c7086">Econometrics · Educational Data Science · Predictive Machine Learning · Explainable AI</text>
<rect x="35" y="102" width="190" height="112" rx="12" fill="#eef5f9" stroke="#c5dae8"/>
