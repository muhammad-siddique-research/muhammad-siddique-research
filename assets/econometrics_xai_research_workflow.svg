<text x="251" y="153" font-family="Arial" font-weight="700" font-size="13" fill="#20364e">DATA ENGINEERING</text>
<text x="251" y="177" font-family="Arial" font-size="13" fill="#4d6073">Provenance + timing</text>
<text x="251" y="195" font-family="Arial" font-size="12" fill="#4d6073">Missingness & privacy</text>
<path d="M 427 155 l 10 0 m -4 -4 l 4 4 l -4 4" fill="none" stroke="#7392a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
