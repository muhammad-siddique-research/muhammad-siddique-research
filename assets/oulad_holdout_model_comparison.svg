<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 438" width="1040" height="438" role="img" aria-labelledby="title desc">
<title id="title">Original OULAD held-out model comparison</title>
<desc id="desc">Two bar-chart panels showing average precision and Brier score for prevalence baseline, regularized logistic regression, Random Forest, and XGBoost, on 7,239 students from six held-out course presentations. Average precision is higher for XGBoost at 0.685 versus logistic regression 0.663; Brier score lower is better, XGBoost 0.204 versus logistic 0.209. Results are observational UK retrospective working-paper analyses, not external U.S. deployment validation.</desc>
<rect width="1040" height="438" rx="18" fill="#f8fafc"/>
<rect x="12" y="12" width="1016" height="414" rx="16" fill="#fff" stroke="#e1e8ee"/>
<text x="40" y="57" font-family="Arial, sans-serif" font-weight="700" font-size="25" fill="#16283d">OULAD | Out-of-presentation prediction</text>
<text x="40" y="86" font-family="Arial, sans-serif" font-size="15" fill="#56677c">Authentic UK learning records · 7,239 held-out enrollments · six course presentations</text>
<line x1="522" y1="113" x2="522" y2="368" stroke="#dbe3ed" stroke-width="2"/>
<text x="37" y="133" font-family="Arial" font-size="18" font-weight="700" fill="#20364e">Average precision  ↑</text><text x="467" y="132" text-anchor="end" font-family="Arial" font-size="12" fill="#62778c">higher is better</text>
<text x="39" y="184" font-family="Arial" font-size="14" fill="#35495f">Prevalence baseline</text>
<rect x="211" y="168" width="235" height="25" rx="5" fill="#edf2f6"/>
<rect x="211" y="168" width="132.32" height="25" rx="5" fill="#aebbc8"/>
<text x="453" y="185" font-family="Arial" font-weight="400" font-size="14" fill="#233c54">0.422</text>
<text x="39" y="231" font-family="Arial" font-size="14" fill="#35495f">Logistic Regression</text>
<rect x="211" y="215" width="235" height="25" rx="5" fill="#edf2f6"/>
<rect x="211" y="215" width="207.77" height="25" rx="5" fill="#4c8aa6"/>
<text x="453" y="232" font-family="Arial" font-weight="400" font-size="14" fill="#233c54">0.663</text>
<text x="39" y="278" font-family="Arial" font-size="14" fill="#35495f">Random Forest</text>
<rect x="211" y="262" width="235" height="25" rx="5" fill="#edf2f6"/>
<rect x="211" y="262" width="212.49" height="25" rx="5" fill="#4c8aa6"/>
<text x="453" y="279" font-family="Arial" font-weight="400" font-size="14" fill="#233c54">0.678</text>
