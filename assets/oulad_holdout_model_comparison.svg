<text x="540" y="184" font-family="Arial" font-size="14" fill="#35495f">Prevalence baseline</text>
<rect x="712" y="168" width="235" height="25" rx="5" fill="#edf2f6"/>
<rect x="712" y="168" width="212.40" height="25" rx="5" fill="#aebbc8"/>
