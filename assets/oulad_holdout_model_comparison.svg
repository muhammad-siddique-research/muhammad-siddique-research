<text x="50" y="388" font-family="Arial" font-size="13" fill="#21565a" font-weight="700">Interpretation:</text>
<text x="50" y="403" font-family="Arial" font-size="12.5" fill="#35595c">XGBoost improves modestly on the primary split; module-level transport and calibration remain limited.</text>
